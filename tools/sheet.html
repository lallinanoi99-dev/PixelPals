<!doctype html>
<meta charset="utf-8">
<title>Sprite sheet</title>
<meta name="robots" content="noindex">
<style>body{margin:0;padding:12px;background:#e9e4dc;font:12px system-ui}div{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}img{width:112px;height:112px;image-rendering:pixelated;border-radius:6px}</style>
<body>
<script type="module">
import * as S from '../assets/sprites.js';
const combos = [[0,0,0,0],[2,1,1,0],[4,2,2,1],[1,3,3,2],[5,0,4,0],[6,1,1,0],[7,3,2,0]];
for (let sp = 0; sp < 3; sp++) for (let st = 0; st < 4; st++) {
  const row = document.body.appendChild(document.createElement('div'));
  for (const [p, pat, acc, m] of combos) {
    const img = new Image();
    img.src = S.svgDataUri(S.renderSVG({ species: sp, stage: st, palette: p, pattern: pat, accessory: acc, mood: m }));
    img.title = `${S.SPECIES[sp]} ${S.STAGES[st]} ${S.PALETTES[p][0]} ${S.PATTERNS[pat]} ${S.ACCESSORIES[acc]} ${S.MOODS[m]}`;
    row.append(img);
  }
}
</script>
